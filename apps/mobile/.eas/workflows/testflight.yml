name: Fork iOS TestFlight
# Auto-triggers on push to main via Expo GitHub App.
on:
  push:
    branches: [main]
jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: fork-testflight
  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: fork-testflight
