name: Fork iOS TestFlight
# Manual only. The automatic push trigger is gone on purpose: the local
# build pipeline (scripts/local-testflight.sh) is the release path, and every
# push to main used to spend Expo build quota plus an App Store Connect
# build number shared with the relay chain. Run this from the Expo dashboard
# when a cloud build is genuinely needed.
on:
  workflow_dispatch: {}
jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: fork-testflight
  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: fork-testflight
