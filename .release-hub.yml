# t3code 在 124 本机由 release-hub 自动构建和发布。
# rsync 只把 release 源码同步到 /opt/t3code；真正的 pnpm 构建、dist 原子更新、
# 用户级 t3code.service 重启与失败回滚由 t3code-deploy oneshot 完成。
deploy:
  kind: rsync
  host: local
  workdir: /opt/t3code
  unit: t3code-deploy
  # 每次合上游都会删几十个文件（.repos 里换掉的参考源码、上游移走的源码、旧 patch、
  # 重新打包的 .tgz）。/opt/t3code 只是构建用的发布副本，残骸没有任何东西靠着它：
  # 备份之后直接删，不再拦下发布等人手删（2026-11 一个月拦了 13 次）。
  prune_retired: true
  units:
    - deploy/t3code-deploy.service
  exclude:
    - ".git/"
    - "node_modules/"
    - ".generated/"
    - "apps/web/dist/"
    - "apps/server/dist/"
  backup_exclude:
    - "node_modules/"
    # /opt/t3code 里残留的开发态数据与 worktree 副本，不是发布产物
    - ".t3"
    - ".wt-*"
    - ".generated/"
    - "apps/web/dist/"
    - "apps/server/dist/"
  health:
    kind: http
    url: http://127.0.0.1:3773/
    expect_status: 200

# 发布后的独立验收。没有这一段时每次发布都是 inconclusive（110 次里 106 次）：
# 验收会话找不到仓库声明的检查，T3 的日志又只在 journald 里。
verification:
  checks:
    - name: t3code web
      kind: http
      host: local
      url: http://127.0.0.1:3773/
      expect_status: 200
    - name: t3code environment
      kind: http
      host: local
      url: http://127.0.0.1:3773/.well-known/t3/environment
      expect_status: 200
      contains: '"environmentId"'
  logs:
    required: false
    reason: "T3 服务器日志只在 journald（t3code.service），未接入 OpenObserve applog"
